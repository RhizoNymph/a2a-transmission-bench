[workspace]
resolver = "3"
members = [
    "crates/corpus",
    "crates/datasets/salt",
    "crates/format",
    "crates/reference",
    "crates/resource",
    "crates/score",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
