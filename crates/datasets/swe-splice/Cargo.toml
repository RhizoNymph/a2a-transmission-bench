[package]
name = "a2a-bench-dataset-swe-splice"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Synthetic file-channel splices in Open-SWE trajectories for a2a-transmission-bench."

[lints]
workspace = true

[dependencies]
a2a-bench-corpus = { version = "0.1.0", path = "../../corpus", features = ["parquet"] }
a2a-bench-dataset-open-swe = { version = "0.1.0", path = "../open-swe" }
a2a-bench-format = { version = "0.1.0", path = "../../format" }
base64 = "=0.23.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tracing = "=0.1.44"

[dev-dependencies]
tempfile = "=3.27.0"
