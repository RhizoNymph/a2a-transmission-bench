[package]
name = "a2a-bench-reference"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The naive reference matcher of a2a-transmission-bench, as a library and as the a2a-reference detector."

[lints]
workspace = true

[[bin]]
name = "a2a-reference"
path = "src/bin/a2a-reference/main.rs"

[dependencies]
a2a-bench-format = { version = "0.1.0", path = "../format" }
anyhow = "=1.0.104"
base64 = "=0.22.1"
blake3 = "=1.8.7"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }

[dev-dependencies]
tempfile = "=3.27.0"
