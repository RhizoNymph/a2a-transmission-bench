[package]
name = "a2a-bench-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The a2a-bench command line: export, validate, input-view, run, score and diff."
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "a2a-bench"
path = "src/bin/a2a-bench/main.rs"

[dependencies]
a2a-bench-corpus = { version = "0.1.0", path = "../corpus" }
a2a-bench-dataset-agentdojo = { version = "0.1.0", path = "../datasets/agentdojo" }
a2a-bench-dataset-ai-village = { version = "0.1.0", path = "../datasets/ai-village" }
a2a-bench-dataset-cipher = { version = "0.1.0", path = "../datasets/cipher" }
a2a-bench-dataset-demo-swarm = { version = "0.1.0", path = "../datasets/demo-swarm" }
a2a-bench-dataset-lmcache = { version = "0.1.0", path = "../datasets/lmcache" }
a2a-bench-dataset-open-swe = { version = "0.1.0", path = "../datasets/open-swe" }
a2a-bench-dataset-salt = { version = "0.1.0", path = "../datasets/salt" }
a2a-bench-dataset-swarm = { version = "0.1.0", path = "../datasets/swarm" }
a2a-bench-dataset-swe-splice = { version = "0.1.0", path = "../datasets/swe-splice" }
a2a-bench-dataset-tau2 = { version = "0.1.0", path = "../datasets/tau2" }
a2a-bench-dataset-wiki = { version = "0.1.0", path = "../datasets/wiki" }
a2a-bench-format = { version = "0.1.0", path = "../format" }
a2a-bench-resource = { version = "0.1.0", path = "../resource" }
a2a-bench-score = { version = "0.1.0", path = "../score" }
anyhow = "=1.0.104"
blake3 = "=1.8.7"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
shlex = "=2.0.1"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }

[dev-dependencies]
tempfile = "=3.27.0"
